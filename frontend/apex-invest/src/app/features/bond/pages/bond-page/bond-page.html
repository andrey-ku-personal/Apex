<div class="bond-page">
  <div class="header">
    <div class="title-block">
      <h2>Облигации</h2>
      <p>{{ totalCount() }} {{ assetsLabel() }}</p>
    </div>
    <button matButton="filled" (click)="createBond()">
      <mat-icon>add</mat-icon>
      Создать новый бонд
    </button>
  </div>

  <app-bond-list-table
    [items]="items()"
    [loading]="loading()"
    [pageNumber]="pageNumber()"
    [pageSize]="pageSize"
    [totalCount]="totalCount()"
    (bondSelect)="openBond($event)"
    (pageChange)="changePage($event)"
  />
</div>
