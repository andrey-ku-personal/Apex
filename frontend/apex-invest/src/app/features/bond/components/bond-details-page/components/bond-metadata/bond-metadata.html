<mat-card class="block-card general-data-card" appearance="outlined">
  <mat-card-header>
    <h3 class="card-header">
      <mat-icon class="card-title-icon">description</mat-icon>
      Данные выпуска
    </h3>
  </mat-card-header>
  <mat-card-content class="general-data-form">
    <app-form-text
      label="Тикер"
      placeholder="OFZ-26228"
      formControlName="ticker"
      [isRequired]="true"
    />
    <app-form-text
      label="Эмитент"
      placeholder="Минфин РФ"
      formControlName="issuer"
      [isRequired]="true"
    />
    <app-form-select
      label="Статус"
      [options]="statuses"
      formControlName="status"
      [isRequired]="true"
    />

    <app-form-number
      label="Номинал"
      placeholder="1000"
      formControlName="parPrice"
      [isRequired]="true"
    />
    <app-form-number
      label="Ставка, %"
      placeholder="12.25"
      formControlName="couponRate"
      [step]="0.01"
      [isRequired]="true"
    />
    <app-form-select
      label="Валюта"
      [options]="currencies"
      formControlName="currency"
      [isRequired]="true"
    />

    <app-form-number
      label="День выплаты"
      placeholder="15"
      formControlName="nextCouponDate"
      [step]="1"
      [isRequired]="true"
    />
    <app-form-date
      label="Дата погашения"
      formControlName="maturityDate"
      [isRequired]="true"
    />
    <app-form-select
      label="Частота"
      formControlName="paymentFrequency"
      [isRequired]="true"
      [options]="frequencies"
    />
  </mat-card-content>
</mat-card>
