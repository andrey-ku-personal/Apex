<div class="bond-details">
  <div class="title-block">
    <h2>Новая Облигация</h2>
    <p>Данные выпуска — общие для всех покупок</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-bond-metadata />
    <app-bond-status />
    <app-bond-sell-buy-operations />

    <div class="form-actions">
      <button matButton="elevated" type="submit">
        <mat-icon>save</mat-icon>
        Сохранить
      </button>
    </div>
  </form>
</div>
