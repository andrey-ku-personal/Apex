<mat-card class="app-card" appearance="outlined">
  <mat-card-header>
    <div class="card-header-row">
      <h3 class="card-header">
        @if (icon()) {
          <mat-icon class="card-title-icon">{{ icon() }}</mat-icon>
        }
        {{ title() }}
      </h3>
      <ng-content select="[cardHeaderTrailing]" />
    </div>
  </mat-card-header>
  <mat-card-content>
    <ng-content />
  </mat-card-content>
</mat-card>
