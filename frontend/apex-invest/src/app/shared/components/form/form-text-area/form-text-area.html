<mat-form-field appearance="outline" class="form-field">
  <mat-label>{{ label() }}{{ isRequired() ? ' *' : '' }}</mat-label>
  <textarea
    matInput
    [rows]="rows()"
    [formControl]="control"
    [placeholder]="placeholder()"
  ></textarea>

  @if (errorMessage) {
    <mat-error>{{ errorMessage }}</mat-error>
  }
</mat-form-field>
